# Dev Recall · docker · 10 thao tác. Xem docs/data-format.md trước khi thêm item.

- id: "docker-containers"
  title: "Xem tất cả container"
  type: "command"
  category: "docker"
  aliases:
    - "docker xem container"
    - "docker container dừng"
    - "docker ps all"
  content: "docker ps -a"
  note: "Liệt kê cả container đang chạy và đã dừng."
  risk: "safe"

- id: "docker-compose-up"
  title: "Khởi động Docker Compose"
  type: "command"
  category: "docker"
  aliases:
    - "docker compose chạy nền"
    - "docker compose up"
    - "docker bật project"
  content: "docker compose up -d"
  note: "Chạy tại thư mục có compose.yaml hoặc docker-compose.yml. -d chạy nền."
  risk: "safe"

- id: "docker-compose-logs"
  title: "Theo dõi log của service"
  type: "command"
  category: "docker"
  aliases:
    - "docker compose logs"
    - "docker xem log"
    - "docker log realtime"
  content: "docker compose logs -f <service>"
  note: "Theo dõi log service. Ctrl+C dừng theo dõi, không dừng container."
  example: "docker compose logs -f app"
  risk: "safe"

- id: "docker-compose-status"
  title: "Xem trạng thái service Compose"
  type: "command"
  category: "docker"
  aliases:
    - "docker compose ps"
    - "docker trạng thái service"
    - "docker compose status"
  content: "docker compose ps"
  note: "Xem container và port của project Compose hiện tại."
  risk: "safe"

- id: "docker-compose-restart"
  title: "Khởi động lại service Compose"
  type: "command"
  category: "docker"
  aliases:
    - "docker restart service"
    - "docker compose restart"
    - "docker chạy lại service"
  content: "docker compose restart <service>"
  note: "Restart container hiện có; không áp dụng thay đổi environment hay cấu hình Compose."
  example: "docker compose restart app"
  risk: "caution"
  riskNote: "Service bị gián đoạn trong lúc khởi động lại. Không thay thế up -d khi đã đổi cấu hình."

- id: "docker-compose-exec"
  title: "Mở shell trong service Compose"
  type: "command"
  category: "docker"
  aliases:
    - "docker vào container"
    - "docker exec shell"
    - "docker compose exec"
  content: "docker compose exec <service> sh"
  note: "Mở shell trong container đang chạy. Dùng bash nếu image có bash."
  example: "docker compose exec app sh"
  risk: "safe"

- id: "docker-compose-build"
  title: "Build lại image của service"
  type: "command"
  category: "docker"
  aliases:
    - "docker compose build"
    - "docker build lại image"
    - "docker rebuild"
  content: "docker compose build <service>"
  note: "Build image; không tự recreate container đang chạy."
  example: "docker compose build app"
  risk: "safe"

- id: "docker-prune-containers"
  title: "Xóa tất cả container đã dừng"
  type: "command"
  category: "docker"
  aliases:
    - "docker xóa container chết"
    - "docker xóa container dừng"
    - "docker container prune"
  content: "docker container prune"
  note: "Docker hỏi xác nhận trước khi xóa. Không xóa container đang chạy."
  risk: "destructive"
  riskNote: "Xóa tất cả container đã dừng và dữ liệu trong writable layer của chúng, không chỉ project hiện tại. Volume không bị xóa bởi lệnh này."

- id: "docker-rename"
  title: "Đổi tên container"
  type: "command"
  category: "docker"
  aliases:
    - "docker rename"
    - "docker đổi tên container"
  content: "docker rename <old> <new>"
  note: "Đổi tên container hiện có, không đổi tên service trong Compose."
  example: "docker rename old-app new-app"
  risk: "safe"

- id: "docker-disk-usage"
  title: "Xem dung lượng Docker đang dùng"
  type: "command"
  category: "docker"
  aliases:
    - "docker dung lượng"
    - "docker disk usage"
    - "docker system df"
  content: "docker system df"
  note: "Xem dung lượng images, containers, local volumes và build cache."
  risk: "safe"
