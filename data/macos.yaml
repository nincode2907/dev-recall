# Dev Recall · macos · 10 thao tác. Xem docs/data-format.md trước khi thêm item.

- id: "macos-hidden-files"
  title: "Hiện hoặc ẩn file ẩn trong Finder"
  type: "shortcut"
  category: "macos"
  aliases:
    - "mac xem file ẩn"
