  note: "Chạy trong terminal để mở thư mục hiện tại trong Finder."
  risk: "safe"

- id: "macos-zsh-config"
  title: "Đường dẫn cấu hình zsh cá nhân"
  type: "path"
  category: "macos"
  aliases:
    - "zsh config path"
    - "file cấu hình zsh"
    - "zshrc"
    - "cấu hình shell mac"
  content: "~/.zshrc"
  note: "File cấu hình được zsh đọc khi mở shell tương tác. File có thể chưa tồn tại; thay đổi chỉ áp dụng khi nạp lại cấu hình hoặc mở shell mới."
  risk: "safe"
