# Dev Recall · git · 12 thao tác. Xem docs/data-format.md trước khi thêm item.

- id: "git-status"
  title: "Xem trạng thái thay đổi Git"
  type: "command"
  category: "git"
  aliases:
    - "git status"
    - "git file nào thay đổi"
    - "git trạng thái"
  content: "git status --short"
  note: "Dạng ngắn: cột đầu là index/staging, cột sau là working tree; ?? là untracked."
  risk: "safe"

- id: "git-diff"
  title: "Xem thay đổi chưa stage"
  type: "command"
  category: "git"
  aliases:
    - "git diff"
    - "git xem thay đổi"
    - "git khác gì"
  content: "git diff"
  note: "So sánh working tree với index. Không hiển thị nội dung file untracked."
  risk: "safe"

- id: "git-staged-diff"
  title: "Xem thay đổi đã stage"
  type: "command"
  category: "git"
  aliases:
    - "git diff staged"
    - "git xem trước commit"
    - "git diff cached"
  content: "git diff --staged"
  note: "Kiểm tra nội dung sẽ vào commit tiếp theo."
  risk: "safe"

- id: "git-switch"
  title: "Chuyển sang branch khác"
  type: "command"
  category: "git"
  aliases:
    - "git đổi branch"
    - "git switch branch"
    - "git checkout branch"
  content: "git switch <branch>"
  note: "Đổi sang branch đã tồn tại. Git có thể từ chối nếu việc chuyển làm mất thay đổi chưa commit."
  example: "git switch main"
  risk: "safe"

- id: "git-new-branch"
  title: "Tạo branch và chuyển sang"
  type: "command"
  category: "git"
  aliases:
    - "git tạo branch"
    - "git new branch"
    - "git tạo nhánh mới"
  content: "git switch -c <branch>"
  note: "Tạo branch từ HEAD hiện tại rồi chuyển sang branch mới."
  example: "git switch -c feat/dev-recall"
  risk: "safe"

- id: "git-rename-branch"
  title: "Đổi tên branch hiện tại"
  type: "command"
  category: "git"
  aliases:
    - "git đổi tên branch"
    - "git rename branch"
    - "git rename"
    - "git đổi tên nhánh hiện tại"
    - "git đổi tên nhánh"
  content: "git branch -m <new-name>"
  note: "Đổi tên branch local hiện tại. Không tự đổi branch trên remote."
  example: "git branch -m feat/recall"
  risk: "safe"

- id: "git-unstage"
  title: "Bỏ stage, giữ thay đổi trong file"
  type: "command"
  category: "git"
  aliases:
    - "git bỏ stage"
    - "git unstage file"
    - "git undo add"
    - "git bỏ add"
  content: "git restore --staged <file>"
  note: "Bỏ file khỏi staging, giữ nội dung working tree. Dùng khi repo đã có commit."
  example: "git restore --staged src/app.ts"
  risk: "safe"

- id: "git-restore-file"
  title: "Bỏ thay đổi chưa stage của file"
  type: "command"
  category: "git"
  aliases:
    - "git bỏ thay đổi file"
    - "git restore file"
    - "git discard changes"
  content: "git restore -- <file>"
  note: "Khôi phục working tree từ index, không phải luôn từ commit HEAD."
  example: "git restore -- src/app.ts"
  risk: "destructive"
  riskNote: "Mất thay đổi chưa stage trong file được chọn. Xem git diff trước khi dùng."

- id: "git-restore-ds-store"
  title: "Bỏ thay đổi chưa stage trong .DS_Store"
  type: "command"
  category: "git"
  aliases:
    - "git restore ds store"
    - "git bỏ thay đổi .DS_Store"
    - "hoàn tác file .DS_Store"
    - "reset git ds_store"
  content: "git restore .DS_Store"
  note: "Chỉ áp dụng nếu .DS_Store đã được Git theo dõi. File được khôi phục từ index; nếu có thay đổi đã stage, chúng vẫn còn trong index."
  risk: "destructive"
  riskNote: "Ghi đè thay đổi chưa stage trong .DS_Store. Kiểm tra `git diff -- .DS_Store` trước khi dùng; file chưa được theo dõi sẽ không bị lệnh này xóa."

- id: "git-skip-worktree"
  title: "Đặt cờ skip-worktree cho file tracked"
  type: "command"
  category: "git"
  aliases:
    - "git skip worktree"
    - "git bỏ qua thay đổi file local"
    - "git skip worktree file tracked"
    - "ẩn thay đổi local khỏi git status"
  content: "git update-index --skip-worktree <file>"
  note: "Chỉ áp dụng cho file đã được Git theo dõi. Bỏ đánh dấu bằng `git update-index --no-skip-worktree <file>`; xem trạng thái bằng `git ls-files -v -- <file>`. Đây là cờ trong index local, không được commit."
  example: "git update-index --skip-worktree config.local.json"
  risk: "caution"
  riskNote: "Cờ phục vụ sparse checkout, không bảo đảm ẩn thay đổi local. Git có thể vẫn ghi file hoặc bỏ cờ trong một số thao tác. Bỏ cờ trước khi kiểm tra và commit thay đổi của file."

- id: "git-log"
  title: "Xem lịch sử commit gọn"
  type: "command"
  category: "git"
  aliases:
    - "git log"
    - "git lịch sử commit"
    - "git graph"
  content: "git log --oneline --graph --decorate -20"
  note: "Hiển thị 20 commit gần nhất và quan hệ giữa các commit."
  risk: "safe"

- id: "git-stash"
  title: "Cất tạm thay đổi đang làm"
  type: "command"
  category: "git"
  aliases:
    - "git stash"
    - "git cất tạm thay đổi"
    - "git save work"
  content: 'git stash push -m "<message>"'
  note: "Cất thay đổi tracked rồi làm sạch working tree tương ứng. Không gồm untracked; dùng git stash list để xem, git stash pop để lấy lại."
  example: 'git stash push -m "đang làm search"'
  risk: "safe"
